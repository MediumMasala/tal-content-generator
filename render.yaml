services:
  # Express.js Backend API
  - type: web
    name: tal-content-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: GOOGLE_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://tal-content.vercel.app
    disk:
      name: tal-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
